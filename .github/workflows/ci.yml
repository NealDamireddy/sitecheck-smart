name: CI

on:
  pull_request:
  push:
    branches: [main, smarts-feature]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: Web app — typecheck, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Build BEFORE tests: the client-bundle secret scan reads
      # .next/static and skips (silently passing) without it.
      - name: Build
        env:
          # Placeholders — these are public-by-design values and CI has
          # no real project. Enough for `next build` to succeed.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          APP_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Security suite
        run: npm run test:security

  bot:
    name: SMARTS bot — typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smarts-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smarts-automation/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      # Includes the certification hard-stop test — the run that must
      # never go green while the bot can reach a Certify control.
      - name: Tests
        run: npm test

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
            APP_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build SMARTS bot image
        uses: docker/build-push-action@v6
        with:
          context: ./smarts-automation
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # E2E writes real rows, so it needs a disposable Supabase project.
    # Without those secrets the specs skip; this job only runs where the
    # environment is configured (see docs/TEST_COVERAGE.md).
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Seed disposable test project
        if: ${{ secrets.E2E_SUPABASE_URL != '' }}
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
        run: npm run db:seed:test

      - name: Run E2E
        env:
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          E2E_USER_A_PROJECT_ID: e2e-project-a
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
